server:
  port: 8080

spring:
  application:
    name: cybertrace-m2-timeline-engine
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

cybertrace:
  deduplication:
    enabled: true
    audit-errors: true

logging:
  level:
    com.cybertrace: DEBUG
