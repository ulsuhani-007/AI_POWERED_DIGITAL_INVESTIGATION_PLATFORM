# =============================================================================
# CyberTrace M1 Backend - Embedded Persistent H2 Database Profile
# Auto-selected when PostgreSQL is not running or standalone mode is desired
# =============================================================================
server.port=8080

# H2 Persistent File Database (stored under data/ in project root)
spring.datasource.url=jdbc:h2:file:./data/cybertrace_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway: Disabled in H2 mode (schema managed automatically by Hibernate DDL)
spring.flyway.enabled=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# CyberTrace Inter-Module Pipeline Integration URLs
cybertrace.m2.url=${CYBERTRACE_M2_URL:http://localhost:8081}
cybertrace.m3.url=${CYBERTRACE_M3_URL:http://localhost:8082}
cybertrace.integration.timeout-seconds=10

