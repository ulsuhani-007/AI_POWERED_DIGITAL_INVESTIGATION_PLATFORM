# CyberTrace M1 Backend Configuration
spring.application.name=cybertrace-m1-backend
server.port=8080

# Default profile set to 'dev' (PostgreSQL). Can be overridden via -Dspring.profiles.active=test or SPRING_PROFILES_ACTIVE
spring.profiles.active=dev

# Multipart File Upload Configuration (Forensic Evidence files)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Jackson Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

# CyberTrace Inter-Module Pipeline Integration URLs
cybertrace.m2.url=${CYBERTRACE_M2_URL:http://localhost:8081}
cybertrace.m3.url=${CYBERTRACE_M3_URL:http://localhost:8082}
cybertrace.integration.timeout-seconds=10
