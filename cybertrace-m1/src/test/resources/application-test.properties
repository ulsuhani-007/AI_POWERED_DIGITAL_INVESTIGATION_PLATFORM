# =============================================================================
# Profile: test (H2 In-Memory Database for Automated Tests)
# =============================================================================
spring.application.name=cybertrace-m1-backend-test
server.port=0

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:cybertrace_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate Configuration for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway during fast H2 unit/slice test suites
spring.flyway.enabled=false
spring.h2.console.enabled=false

spring.jackson.serialization.write-dates-as-timestamps=false

# Mock/local test integration URLs
cybertrace.m2.url=http://localhost:8081
cybertrace.m3.url=http://localhost:8082
cybertrace.integration.timeout-seconds=1
